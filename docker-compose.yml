services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # MySQL ejecuta estos scripts, en orden de nombre, solo la primera vez
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/seed-perritos.sql:/docker-entrypoint-initdb.d/03-seed-perritos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: perritos_db
      RUTA_IMAGENES: /data/imagenes
      PORT: 3000
    volumes:
      - imagenes:/data/imagenes
      - ./database/fotos-prueba:/seed-fotos:ro
    # copia las fotos de prueba al volumen (sin pisar las existentes) y arranca
    command: sh -c "cp -n /seed-fotos/* /data/imagenes/; node server.js"
    depends_on:
      db:
        condition: service_healthy

  funcional:
    build: ./funcional
    environment:
      TZ: America/Monterrey

  frontend:
    build: ./frontend

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"   # única entrada; para probar en local: http://localhost:8080
    depends_on: [frontend, backend, funcional]

  herramientas:
    image: elixir:1.18-alpine
    profiles: ["herramientas"]
    working_dir: /app
    volumes:
      - ./funcional:/app
      - mix_cache:/root/.mix
      - hex_cache:/root/.hex

volumes:
  db_data:
  imagenes:
  mix_cache:
  hex_cache: