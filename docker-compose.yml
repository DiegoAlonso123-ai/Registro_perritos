services:
  funcional:
    build: ./funcional
    environment:
      TZ: America/Monterrey
    ports:
      - "4000:4000"   # temporal, para probar solo; se quita cuando exista el proxy

  herramientas:
    image: elixir:1.18-alpine
    profiles: ["herramientas"]
    working_dir: /app
    volumes:
      - ./funcional:/app
      - mix_cache:/root/.mix
      - hex_cache:/root/.hex

volumes:
  mix_cache:
  hex_cache: