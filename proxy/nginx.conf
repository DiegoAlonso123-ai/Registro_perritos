server {
    listen 80;
    client_max_body_size 10m;   # fotos (el backend acepta hasta 8 MB)

    # Backend del P1: conserva el prefijo /api (sin barra al final de proxy_pass)
    location /api/ {
        proxy_pass http://backend:3000;
    }

    # Servicio Elixir: conserva el prefijo /f
    location /f/ {
        proxy_pass http://funcional:4000;
    }

    # Todo lo demás: el frontend
    location / {
        proxy_pass http://frontend:80;
    }
}